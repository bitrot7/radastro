id: rad_astro_avg
label: avg
category: '[rad_astro]'

templates:
  imports: from gnuradio import rad_astro
  make: rad_astro.avg(${vlen}, ${numAvgs}, ${avgType}, ${alpha}, ${beta}, ${delta}, ${gamma})

#  Make one 'parameters' list entry for every parameter you want settable from the GUI.
#     Keys include:
#     * id (makes the value accessible as keyname, e.g. in the make entry)
#     * label (label shown in the GUI)
#     * dtype (e.g. int, float, complex, byte, short, xxx_vector, ...)
#     * default
parameters:
- id: vlen
  label: Vector Length
  dtype: int
  default: 1024

- id: numAvgs
  label: Number of Averages of Vectors
  dtype: int
  default: 2

- id: avgType
  label: Type of Average
  dtype: int
  default: 0

- id: alpha
  label: Alpha for EMF or WMF average
  dtype: float
  default: 1.0

- id: beta
  label: Beta for EMF or WMF average
  dtype: float
  default: 1.0

- id: delta
  label: Delta for EMF or WMF average
  dtype: float
  default: 1.0

- id: gamma
  label: Gamma for EMF or WMF average
  dtype: float
  default: 1.0

#- id: ...
#  label: ...
#  dtype: ...

#  Make one 'inputs' list entry per input and one 'outputs' list entry per output.
#  Keys include:
#      * label (an identifier for the GUI)
#      * domain (optional - stream or message. Default is stream)
#      * dtype (e.g. int, float, complex, byte, short, xxx_vector, ...)
#      * vlen (optional - data stream vector length. Default is 1)
#      * optional (optional - set to 1 for optional inputs. Default is 0)
inputs:
- label: in
  domain: stream
  dtype: float
  vlen: ${vlen}
  optional: 0

outputs:
- label: out
  domain: stream
  dtype: float
  vlen: ${vlen}
  optional: 0

#  'file_format' specifies the version of the GRC yml format used in the file
#  and should usually not be changed.
file_format: 1
